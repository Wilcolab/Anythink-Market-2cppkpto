name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04   # important

    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Test MongoDB connection
        run: |
          echo "MongoDB should be running"
